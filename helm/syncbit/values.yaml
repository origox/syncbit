# Default values for syncbit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas for the deployment
# Note: Only use 1 replica due to token file storage
replicaCount: 1

image:
  # -- Container registry and repository
  repository: ghcr.io/origox/syncbit
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "@sha256:6a17ba05a50207d9db6f1f1e4f92fcd9670c144470e68e47927b32eb772cf3de"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""

# -- Override the full name of the release
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Security context for the pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
    - ALL

# -- Resource requests and limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

# Persistence for token storage
persistence:
  # -- Enable persistent volume for token storage
  enabled: true
  # -- Storage class name (leave empty for default)
  storageClassName: ""
  # -- Access modes for the persistent volume
  accessModes:
    - ReadWriteOnce
  # -- Size of the persistent volume
  size: 1Gi
  # -- Annotations for the PVC
  annotations: {}

# External Secrets Operator configuration
externalSecrets:
  # -- Enable External Secrets Operator integration
  enabled: false
  # -- Refresh interval for secrets
  refreshInterval: 1h
  # SecretStore configuration
  secretStore:
    # -- Name of the SecretStore or ClusterSecretStore
    name: "onepassword"
    # -- Kind of secret store (SecretStore or ClusterSecretStore)
    kind: ClusterSecretStore
  # Note: Secret paths are hardcoded in templates/externalsecret.yaml
  # Expected 1Password items in 'kubernetes' vault:
  #   - syncbit: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
  #     (FITBIT_CLIENT_ID, FITBIT_CLIENT_SECRET instead when config.healthProvider=fitbit)
  #   - victoria-metrics: USER, PASSWORD, ENDPOINT

# Kubernetes Secrets (used when externalSecrets.enabled is false)
secrets:
  # -- Google OAuth2 Client ID (used when config.healthProvider=google)
  # Get this from https://console.cloud.google.com/auth/clients
  googleClientId: ""
  # -- Google OAuth2 Client Secret (used when config.healthProvider=google)
  googleClientSecret: ""
  # -- Fitbit OAuth2 Client ID (used when config.healthProvider=fitbit)
  # Get this from https://dev.fitbit.com/apps
  fitbitClientId: ""
  # -- Fitbit OAuth2 Client Secret (used when config.healthProvider=fitbit)
  fitbitClientSecret: ""
  # -- Victoria Metrics username
  victoriaUser: ""
  # -- Victoria Metrics password
  victoriaPassword: ""
  # -- Victoria Metrics endpoint URL
  victoriaEndpoint: ""

# Application configuration
config:
  # -- Sync interval in minutes
  syncIntervalMinutes: 15
  # -- Log level (DEBUG, INFO, WARNING, ERROR)
  logLevel: INFO
  # -- Health data provider: "google" (Google Health API) or "fitbit"
  # (legacy Fitbit Web API, shut down by Google on 2026-11-02)
  healthProvider: google
  # -- Google OAuth redirect URI (must be registered on the OAuth client)
  googleRedirectUri: "http://localhost:8080/callback"
  # -- Device label applied to every metric (Fitbit-era data uses "charge6")
  deviceLabel: "fitbit_air"
  # -- Fitbit OAuth redirect URI
  fitbitRedirectUri: "http://localhost:8080/callback"
  # -- User ID for metric labels
  fitbitUserId: "default"
  # -- Backfill start date (YYYY-MM-DD format)
  backfillStartDate: "2025-06-01"

  # Intraday data collection settings
  intraday:
    # -- Enable intraday data collection
    enabled: true
    # -- Detail level for activity data (1min, 5min, 15min)
    detailLevel: "5min"
    # -- Detail level for heart rate data (1sec, 1min, 5min, 15min)
    heartRateDetail: "1min"
    # -- Resources to collect (comma-separated: steps, calories, distance, heart_rate;
    # elevation and floors are Fitbit-only)
    resources: "steps,calories,distance,heart_rate"
    # -- Enable backfill of historical intraday data
    backfillEnabled: true
    # -- Number of days to backfill
    backfillDays: 30

# OAuth2 Authorization Job
authorization:
  # -- Create a Kubernetes Job to run OAuth authorization
  # Set to true to create the job, then use kubectl port-forward to access the OAuth callback
  # The job will run the authorization flow and save tokens to the persistent volume
  createJob: false

# Liveness probe configuration
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  # -- Initial delay before liveness probe starts
  initialDelaySeconds: 30
  # -- Period between liveness probes
  periodSeconds: 30
  # -- Timeout for liveness probe
  timeoutSeconds: 10
  # -- Success threshold for liveness probe
  successThreshold: 1
  # -- Failure threshold for liveness probe
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  # -- Enable readiness probe
  enabled: true
  # -- Initial delay before readiness probe starts
  initialDelaySeconds: 10
  # -- Period between readiness probes
  periodSeconds: 10
  # -- Timeout for readiness probe
  timeoutSeconds: 5
  # -- Success threshold for readiness probe
  successThreshold: 1
  # -- Failure threshold for readiness probe
  failureThreshold: 3

# Network policy
networkPolicy:
  # -- Enable network policy
  enabled: false
  # -- Egress rules (empty allows all)
  egress: []
  # -- Ingress rules (empty denies all)
  ingress: []
