apiVersion: v1
kind: ConfigMap
metadata:
  name: syncbit-config
  namespace: default
data:
  VICTORIA_ENDPOINT: ""
  HEALTH_PROVIDER: "google"
  GOOGLE_REDIRECT_URI: "http://localhost:8080/callback"
  DEVICE_LABEL: "fitbit_air"
  FITBIT_REDIRECT_URI: "http://localhost:8080/callback"
  SYNC_INTERVAL_MINUTES: "15"
  DATA_DIR: "/app/data"
  FITBIT_USER_ID: "default"
  LOG_LEVEL: "INFO"
